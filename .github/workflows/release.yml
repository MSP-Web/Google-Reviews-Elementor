name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build release zip
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Determine zip filename
        id: zip
        run: |
          ZIP_FILE=$(ls msp-google-reviews-v*.zip)
          echo "path=$ZIP_FILE" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$ZIP_FILE")" >> "$GITHUB_OUTPUT"

      - name: Sync README version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          sed -i "0,/^\*\*Version:\*\* .*/s//\*\*Version:\*\* ${VERSION}/" README.md
          sed -i "0,/^\*\*Version:\*\* .*/s//\*\*Version:\*\* ${VERSION}/" msp-google-reviews/README.md

      - name: Commit and push README version sync
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md msp-google-reviews/README.md
          git commit -m "docs: sync README version to ${{ github.ref_name }}" || echo "No changes to commit"
          git push origin HEAD:main

      - name: Create or update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          files: ${{ steps.zip.outputs.path }}
          fail_on_unmatched_files: true
          generate_release_notes: true
