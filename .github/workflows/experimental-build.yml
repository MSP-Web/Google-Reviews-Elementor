name: Experimental Build

on:
  push:
    branches:
      - "feature/**"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build release zip
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Determine zip filename
        id: zip
        run: |
          ZIP_FILE=$(ls msp-google-reviews-v*.zip)
          echo "path=$ZIP_FILE" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$ZIP_FILE")" >> "$GITHUB_OUTPUT"

      - name: Sanitize branch name for artifact naming
        id: branch
        run: |
          SAFE_NAME=$(echo "${{ github.ref_name }}" | tr '/' '-')
          echo "safe_name=$SAFE_NAME" >> "$GITHUB_OUTPUT"

      - name: Unpack zip for artifact upload
        run: unzip -q "${{ steps.zip.outputs.path }}" -d unpacked/

      - name: Upload experimental build artifact
        uses: actions/upload-artifact@v4
        with:
          name: msp-google-reviews-experimental-${{ steps.branch.outputs.safe_name }}-${{ github.sha }}
          path: unpacked/
          retention-days: 14
